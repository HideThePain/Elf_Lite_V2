 tradition_knights_elros_desc:0 "The Knights of Elros"
 
 tradition_knights_kesselrine:0 "Knights of the Kesselrine"
 tradition_knights_kesselrine_desc:0 "The Knights of house Kesselrine"

 warband_ravagers:0 "Ravagers"
 warband_ravagers_flavor:0 "The Ravagers are a warband of elite mercenaries that can be hired by elven culture armies. They are known for their brutal tactics and their willingness to take on any job, no matter how dangerous or morally questionable."

 warband_vanguards:0 "Vanguards"
 warband_vanguards_flavor:0 "The Vanguards are a warband of elite mercenaries that can be hired by elven culture armies. They are known for their disciplined tactics and their unwavering loyalty to their employers, often serving as the backbone of elven armies in times of war."

 feywind_cavaliers:0 "Feywind Cavaliers"
 feywind_cavaliers_flavor:0 "The Feywind Cavaliers are a warband of elite mercenaries that can be hired by elven culture armies. They are known for their chivalrous code of conduct and their prowess in mounted combat, often serving as the vanguard of elven forces in battle.""

 crescentglade_knights:0 "Crescentglade Knights"
 crescentglade_knights_flavor:0 "The Crescentglade Knights are a warband of elite mercenaries that can be hired by elven culture armies. They are known for their swift and agile tactics, often utilizing hit-and-run strategies to outmaneuver their enemies on the battlefield."